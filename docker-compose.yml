version: '3.8'

volumes:
  n8n_storage:
    external: false

services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./ai_powered_lead_qualification:/data/workflows/ai_lead_qual
      - ./ecommerce_order_processing:/data/workflows/ecommerce_order
      - ./real_estate_investor_engine:/data/workflows/real_estate
